[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cssanta9-infersre_jd392"
version = "0.1.0"
description = "从样本里推断推理服务 SRE 工程师·训练数据配比与课程学习应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cssanta9" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cssanta9.github.io"
Repository = "https://github.com/cssanta9/infersre_jd392"
Issues = "https://github.com/cssanta9/infersre_jd392/issues"

[project.scripts]
infersre_jd392 = "infersre_jd392:main"

[tool.setuptools]
py-modules = ["infersre_jd392"]
